<svg xmlns="http://www.w3.org/2000/svg" width="920" height="136" viewBox="0 0 920 136" role="img" aria-label="GitHub metrics">
  <defs>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FCEE0A"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="920" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1026"/>
      <stop offset="100%" stop-color="#150A2E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="136" rx="18" fill="url(#fill)" stroke="url(#border)" stroke-width="2"/>
  <text x="28" y="42" fill="#00D9FF" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="3" filter="url(#glow)">LIVE DASHBOARD</text>
  <text x="28" y="72" fill="#AEB8C8" font-family="'Segoe UI', sans-serif" font-size="14" letter-spacing="1.2">VEDANT CHAUDHARI · SOFTWARE DEVELOPER</text>
  <g font-family="'Cascadia Code', 'Consolas', monospace" font-size="15" font-weight="600">
    <text x="28" y="108"><tspan fill="#FCEE0A">14</tspan><tspan fill="#E6EDF3"> repos</tspan></text>
    <text x="168" y="108"><tspan fill="#00D9FF">18</tspan><tspan fill="#E6EDF3"> followers</tspan></text>
    <text x="352" y="108"><tspan fill="#BD93F9">3</tspan><tspan fill="#E6EDF3"> stars</tspan></text>
    <text x="502" y="108"><tspan fill="#E6EDF3">active since </tspan><tspan fill="#FF6B6B">2022</tspan></text>
  </g>
  <rect x="700" y="32" width="188" height="72" rx="12" fill="#12182B" stroke="#00D9FF" stroke-opacity="0.45"/>
  <text x="794" y="62" text-anchor="middle" fill="#00D9FF" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="2">YARDI</text>
  <text x="794" y="84" text-anchor="middle" fill="#C9D1D9" font-family="'Segoe UI', sans-serif" font-size="12">Pune · IST</text>
</svg>
