<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="GitHub metrics">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="120" rx="16" fill="#0D0221" stroke="url(#g)" stroke-width="2"/>
  <text x="32" y="38" fill="#00D9FF" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" filter="url(#glow)">¡ LIVE METRICS</text>
  <text x="32" y="62" fill="#8B949E" font-family="Segoe UI, system-ui, sans-serif" font-size="13">vedant237 · Software Developer · Yardi</text>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#E6EDF3">
    <text x="32" y="98"><tspan fill="#FCEE0A">14</tspan> repos</text>
    <text x="180" y="98"><tspan fill="#00D9FF">18</tspan> followers</text>
    <text x="380" y="98"><tspan fill="#BD93F9">3</tspan> stars</text>
    <text x="540" y="98">since <tspan fill="#FF6B6B">2022</tspan></text>
  </g>
  <rect x="680" y="28" width="188" height="64" rx="10" fill="#161B22" stroke="#30363D"/>
  <text x="774" y="58" text-anchor="middle" fill="#00D9FF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">CODING</text>
  <text x="774" y="78" text-anchor="middle" fill="#C9D1D9" font-family="Segoe UI, sans-serif" font-size="11">Pune · IST</text>
</svg>
