name: Generate snake animation

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: vedant237
          outputs: |
            dist/github-contribution-grid-snake.svg?year=2024,2025,2026
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&year=2024,2025,2026

      - uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update contribution snake"
